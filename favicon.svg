<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
/* ---------- h-dot mark: the dot runs forward ---------- */
    .hdot-h {
      fill: none;
      stroke: currentColor;
      stroke-width: 3.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .hdot-dot {
      fill: #2f7df6;
    }
    .hdot-trail {
      fill: none;
      stroke: #2f7df6;
      stroke-width: 1.5;
      stroke-linecap: round;
      opacity: 0;
    }
    .hdot-run,
    .hdot-dot,
    .hdot-trail {
      transform-box: fill-box;
    }
    .hdot-dot {
      transform-origin: 50% 50%;
    }
    .hdot-trail {
      transform-origin: 100% 50%;
    }
    .hdot--animated .hdot-run {
      animation: hdot-run 2.2s cubic-bezier(0.45, 0, 0.25, 1) infinite;
    }
    .hdot--animated .hdot-dot {
      animation: hdot-squash 2.2s ease-in-out infinite;
    }
    .hdot--animated .hdot-trail {
      animation: hdot-trail 2.2s ease-out infinite;
    }
    /* Rest, wind up, dash out of frame, re-enter from behind, settle */
    @keyframes hdot-run {
      0%, 38% { transform: translateX(0); opacity: 1; }
      46%      { transform: translateX(-0.9px); opacity: 1; }
      54%      { transform: translateX(2.8px); opacity: 1; }
      60%      { transform: translateX(6px); opacity: 0; }
      61%      { transform: translateX(-5px); opacity: 0; }
      66%      { transform: translateX(-2.6px); opacity: 1; }
      78%      { transform: translateX(0.7px); }
      88%      { transform: translateX(-0.2px); }
      100%     { transform: translateX(0); opacity: 1; }
    }
    @keyframes hdot-squash {
      0%, 38% { transform: scale(1, 1); }
      46%      { transform: scale(0.86, 1.12); }
      56%      { transform: scale(1.55, 0.78); }
      61%      { transform: scale(0.7, 0.7); }
      68%      { transform: scale(1.4, 0.82); }
      80%      { transform: scale(0.9, 1.08); }
      90%, 100% { transform: scale(1, 1); }
    }
    @keyframes hdot-trail {
      0%, 47%  { opacity: 0; transform: scaleX(0.3); }
      54%      { opacity: 0.85; transform: scaleX(1); }
      60%      { opacity: 0; transform: scaleX(1.3); }
      62%      { opacity: 0; transform: scaleX(0.3); }
      68%      { opacity: 0.75; transform: scaleX(1); }
      82%, 100% { opacity: 0; transform: scaleX(0.4); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hdot--animated .hdot-run,
      .hdot--animated .hdot-dot,
      .hdot--animated .hdot-trail {
        animation: none;
      }
    }
    .hdot-h { stroke: #17202b; }
    @media (prefers-color-scheme: dark) { .hdot-h { stroke: #f5f7fa; } }
  </style>
  <g class="hdot hdot--animated">
    <path class="hdot-h" d="M6 4.5v23M6 17.2c0-3.9 2.9-6.4 6.5-6.4s6.2 2.5 6.2 6.4v10.3"/>
    <g class="hdot-run"><path class="hdot-trail" d="M20.2 23.9h3.1M21.2 27.3h2.2"/><circle class="hdot-dot" cx="26.6" cy="25.6" r="2.7"/></g>
  </g>
</svg>
