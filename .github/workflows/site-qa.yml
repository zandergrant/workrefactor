name: Website browser QA
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Serve static site
        run: |
          python3 -m http.server 4173 > /tmp/site-server.log 2>&1 &
          echo $! > /tmp/site-server.pid
      - name: Run viewport and contact smoke tests
        run: node scripts/site-qa.mjs
